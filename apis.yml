name: Health IQ
description: Health IQ was a venture-backed insurtech founded in 2013 in Mountain View, California
  that offered lower-cost life insurance to health-conscious individuals, later pivoting in 2019 to
  selling Medicare Advantage plans to seniors. Backed by a16z and others (~$200M raised), the company
  laid off staff in December 2022 and filed for Chapter 7 liquidation on August 30, 2023. As of this
  enrichment pass the healthiq.com domain resolves to a parked "domain may be for sale" page, and the
  company operates no public website, developer portal, or API. Retained in the network as a defunct
  a16z portfolio lead with no enrichable API surface.
